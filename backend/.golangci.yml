run:
  timeout: 5m
  tests: false

issues:
  exclude-use-default: false
  max-same-issues: 3
  uniq-by-line: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - typecheck
    - unused
    - gocyclo

linters-settings:
  gocyclo:
    min-complexity: 15
  govet:
    enable-all: true
    disable:
      - shadow
