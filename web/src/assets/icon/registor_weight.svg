<svg
  width="300"
  height="300"
  viewBox="0 0 300 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 背景は透明 -->

  <!-- 体重計の外枠 -->
  <rect
    x="60"
    y="70"
    width="180"
    height="160"
    rx="30"
    ry="30"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="10"
  />

  <!-- 上部の丸いメーター部分 -->
  <path
    d="M80 130
       A70 70 0 0 1 220 130"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="8"
  />

  <!-- 針の中心 -->
  <circle
    cx="150"
    cy="130"
    r="6"
    fill="#FFFFFF"
  />

  <!-- 針 -->
  <line
    x1="150"
    y1="130"
    x2="185"
    y2="110"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- WEIGHT テキスト -->
  <text
    x="150"
    y="250"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="28"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  >
    WEIGHT
  </text>
</svg>