<svg
  width="300"
  height="300"
  viewBox="0 0 300 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 背景は透明 -->

  <!-- ダンベル本体 -->
  <!-- 左プレート -->
  <rect
    x="60"
    y="120"
    width="30"
    height="60"
    rx="6"
    fill="#FFFFFF"
  />
  <!-- 右プレート -->
  <rect
    x="210"
    y="120"
    width="30"
    height="60"
    rx="6"
    fill="#FFFFFF"
  />
  <!-- バーベルの棒 -->
  <rect
    x="90"
    y="140"
    width="120"
    height="20"
    rx="10"
    fill="#FFFFFF"
  />

  <!-- TRAINING テキスト -->
  <text
    x="150"
    y="230"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="28"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  >
    TRAINING
  </text>
</svg>