<svg
  width="300"
  height="300"
  viewBox="0 0 300 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- 背景：何も描かないので完全に透明 -->

  <!-- 外側の丸枠 -->
  <circle
    cx="150"
    cy="150"
    r="120"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="16"
  />

  <!-- メニューの3本線 -->
  <line
    x1="90"
    y1="115"
    x2="210"
    y2="115"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
  />
  <line
    x1="90"
    y1="150"
    x2="210"
    y2="150"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
  />
  <line
    x1="90"
    y1="185"
    x2="210"
    y2="185"
    stroke="#FFFFFF"
    stroke-width="16"
    stroke-linecap="round"
  />
</svg>